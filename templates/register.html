{% extends "base.html" %}
{% block title %}Create account · {{ site_name }}{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:440px">
  <h1 class="h2 mb-4">Create an account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input class="form-control" id="username" name="username" maxlength="64" autocomplete="username" required autofocus>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
      <div class="form-text">At least 8 characters.</div>
    </div>
    <button class="btn btn-primary w-100" type="submit">Create account</button>
  </form>
  <p class="mt-3 small text-secondary">Already registered? <a href="{{ url_for('login') }}">Login</a>.</p>
</div>
{% endblock %}
