{% extends "base.html" %}
{% block title %}Login · {{ site_name }}{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:440px">
  <h1 class="h2 mb-4">Login</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label for="identifier" class="form-label">Username or email</label>
      <input class="form-control" id="identifier" name="identifier" autocomplete="username" required autofocus>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="remember" name="remember">
      <label class="form-check-label" for="remember">Keep me logged in</label>
    </div>
    <button class="btn btn-primary w-100" type="submit">Login</button>
  </form>
  <p class="mt-3 small text-secondary">New here? <a href="{{ url_for('register') }}">Create an account</a>.</p>
</div>
{% endblock %}
